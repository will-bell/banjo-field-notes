<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">Banjo Field Notes</a>
      <nav>
        <a href="{{ '/journal/' | relative_url }}">Journal</a>
        <a href="{{ '/theory/' | relative_url }}">Theory</a>
        <a href="{{ '/tunings/' | relative_url }}">Tunings</a>
        <a href="{{ '/chord-charts/' | relative_url }}">Chords</a>
        <a href="{{ '/tunes/' | relative_url }}">Tunes</a>
        <a href="{{ '/lab/' | relative_url }}">Lab</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="wrap site-footer">
    <hr>
    <p><small>Notes may be incomplete, provisional, or gloriously wrong.</small></p>
  </footer>
</body>
</html>
